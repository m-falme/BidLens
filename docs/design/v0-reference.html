<script>
const content=document.getElementById('content');let activePage='tenders',activeStage='Interpretation';const stages=['Interpretation','Compliance','Commercial','Recommendation','Bid preparation'];
const titleMap={overview:'Overview',tenders:'Tender workspace',company:'Company profile',evidence:'Evidence library',trail:'Decision trail',settings:'Settings'};
function heading(kicker,title,sub,actions=''){return `<div class="eyebrow">${kicker}</div><div class="heading"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function stageControls(){return `<div class="workflow-tabs">${stages.map(s=>`<button class="${activeStage===s?'active':''}" onclick="setStage('${s}')">${s}</button>`).join('')}</div>`}
function factsView(){return `<div class="finding"><div><div class="f-title">Bid security <span class="pill warn">CONFLICT FOUND</span></div><p>Two amounts appear in the tender. They are kept separate until a reviewer confirms which governs.</p><div class="source"><em>“Tender security shall be KES 300,000.”</em> <a href="#" onclick="notify('Source opened at page 12.');return false">Page 12 ↗</a><br><em>“Tender security of KES 250,000 must accompany the tender.”</em> <a href="#" onclick="notify('Source opened at page 47.');return false">Page 47 ↗</a></div></div><div class="confidence">High confidence</div></div><div class="finding"><div><div class="f-title">Closing date <span class="pill">CONFIRMED</span></div><p>24 November 2026 at 10:00 EAT. Addendum 1 supersedes the original deadline of 17 November.</p><div class="source"><em>“The deadline for submission is extended to 24th November 2026 at 10:00 hours.”</em> <a href="#" onclick="notify('Addendum 1 opened at page 2.');return false">Addendum 1, p. 2 ↗</a></div></div><div class="confidence">High confidence</div></div><div class="finding"><div><div class="f-title">Late payment interest <span class="pill blue">BLANK IN SOURCE</span></div><p>The contract leaves the interest rate blank. This could increase the cost of financing delayed payments.</p><div class="source"><em>“Interest on delayed payment shall be calculated at a rate of ____ per annum.”</em> <a href="#" onclick="notify('Source opened at page 83.');return false">Page 83 ↗</a></div></div><div class="confidence">High confidence</div></div>`}
function complianceView(){return `<div class="callout">A missing upload is marked “Evidence required,” not “Not met.” Add company evidence or assign an owner before approving this stage.</div><div class="table-wrap"><table><thead><tr><th>Requirement</th><th>Assessment</th><th>Evidence</th><th>Owner</th></tr></thead><tbody><tr><td><strong>Valid tax compliance certificate</strong><br>Mandatory · Tender p. 18</td><td><span class="tag amber">Evidence required</span></td><td>Not found in library</td><td>Jane Mwangi</td></tr><tr><td><strong>Three comparable assignments</strong><br>Mandatory · Tender p. 21</td><td><span class="tag green">Met</span></td><td>Zanari case studies (3)</td><td>Verified</td></tr><tr><td><strong>Lead data scientist, 7+ years</strong><br>Technical · Tender p. 33</td><td><span class="tag">Needs human</span></td><td>CV on file · confirm years</td><td>People team</td></tr><tr><td><strong>Professional indemnity cover</strong><br>Mandatory · Tender p. 19</td><td><span class="tag amber">To prepare</span></td><td>Policy expires 15 Dec 2026</td><td>Finance</td></tr></tbody></table></div>`}
function commercialView(){return `<div class="pad"><div class="card-head" style="padding:0 0 10px"><div><h3>Payment-delay scenarios</h3><p>Illustrative calculations from your editable assumptions—not a forecast.</p></div><button class="btn small" onclick="notify('Scenario assumptions editor opened.')">Edit assumptions</button></div><div class="metric-row"><div class="metric"><small>Contract value</small><strong>KES 8.4m</strong></div><div class="metric"><small>Expected margin</small><strong>22%</strong></div><div class="metric"><small>Financing rate</small><strong>18% p.a.</strong></div><div class="metric"><small>Advance assumed</small><strong>0%</strong></div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Payment delay</th><th>Estimated finance cost</th><th>Scenario profit</th><th>Margin after finance</th></tr></thead><tbody><tr><td>2 months</td><td>KES 252k</td><td><strong>KES 1.60m</strong></td><td>19.0%</td></tr><tr><td>6 months</td><td>KES 756k</td><td><strong>KES 1.10m</strong></td><td>13.0%</td></tr><tr><td>12 months</td><td>KES 1.51m</td><td><strong>KES 344k</strong></td><td>4.1%</td></tr><tr><td>24 months</td><td>KES 3.02m</td><td><strong style="color:var(--red)">−KES 1.17m</strong></td><td>−13.9%</td></tr></tbody></table></div><div class="callout" style="margin:13px 0 0">Buyer context: latest public Controller of Budget report indicates pending bills for Makueni County. This is dated context, not a prediction of this contract’s payment timing.</div></div>`}
function recommendationView(){return `<div class="reason"><div class="reason-top"><span class="status warn"><i class="dot"></i> PRELIMINARY · HUMAN DECISION REQUIRED</span><span class="confidence">Rule-based assessment</span></div><h3>Recommendation: Bid only if two conditions are resolved</h3><p>There is a credible capability match, but unresolved eligibility evidence and payment exposure make an unconditional “Bid” premature. The recommendation is generated from the checks below; management owns the final decision.</p><div class="reason-items"><div class="reason-item"><b><span style="color:var(--green)">↑</span> Why this could be a bid</b><p>Three comparable assignments are on file. The work aligns with Zanari’s analytics team and the base-case margin is positive.</p></div><div class="reason-item"><b><span style="color:var(--amber)">!</span> Why not to bid yet</b><p>Tax compliance evidence is not in the library. Bid security conflicts across two pages. At 24 months’ delay, modeled profit turns negative.</p></div><div class="reason-item"><b>Conditions before approval</b><p>Confirm governing security amount, verify tax certificate validity, and secure an advance or acceptable payment terms.</p></div><div class="reason-item"><b>What would change this view?</b><p>Verified evidence, a buyer clarification, or an agreed commercial safeguard can change the rules-based outcome.</p></div></div><div class="review-foot" style="margin:16px -20px -18px"><span>Management approval is required. No bid is submitted automatically.</span><div class="foot-actions"><button class="btn small" onclick="openModal()">Override with reason</button><button class="btn primary small" onclick="notify('Decision recorded for management review. Add your rationale in the decision trail.')">Record decision</button></div></div></div>`}
function prepView(){return `<div class="pad"><div class="card-head" style="padding:0 0 12px"><div><h3>Bid preparation workspace</h3><p>Draft from verified requirements. Unverified claims stay as explicit placeholders.</p></div><button class="btn primary small" onclick="notify('Response outline draft created with placeholders for review.')">Create response outline</button></div><div class="list-row"><span class="tick">1</span><div><b>Compliance matrix</b><small>Requirements mapped to evidence, status and owner · 12 rows</small></div><button class="textlink" onclick="notify('Compliance matrix preview opened.')">Preview →</button></div><div class="list-row"><span class="tick warn">2</span><div><b>Outstanding documents checklist</b><small>Tax certificate, insurance confirmation · 2 open items</small></div><button class="textlink" onclick="notify('Checklist preview opened.')">Preview →</button></div><div class="list-row"><span class="tick">3</span><div><b>Response outline</b><small>Technical approach, team and work plan · claims require human input</small></div><button class="textlink" onclick="notify('Outline preview opened.')">Preview →</button></div><div class="callout" style="margin:14px 0 0">No prices, CV claims, certificates or past-performance statements are generated as facts. Placeholders must be completed and verified by your team.</div></div>`}
function renderTender(){let body=activeStage==='Interpretation'?factsView():activeStage==='Compliance'?complianceView():activeStage==='Commercial'?commercialView():activeStage==='Recommendation'?recommendationView():prepView();let idx=stages.indexOf(activeStage);return `${heading('Tender workspace','Provision of Data Analytics Consultancy Services','A guided review from tender intake to a documented bid/no-bid decision.',`<button class="btn" onclick="notify('Tender source document opened.')">↗ Open tender</button>`)}<section class="card"><div class="tender-banner"><div><span class="status"><i class="dot"></i> IN REVIEW · STAGE ${idx+2} OF 5</span><h2>Provision of Data Analytics Consultancy Services</h2><div class="meta"><span>Buyer<strong>County Government of Makueni</strong></span><span>Ref<strong>MG/ICT/OT/041/2026</strong></span><span>Closing<strong>24 Nov 2026 · 10:00 EAT</strong></span></div></div></div><div class="stage-bar">${stages.map((s,i)=>`<div class="stage ${i<idx?'done':''} ${i===idx?'current':''}"><span class="num">${i<idx?'✓':i+1}</span>${s}</div>`).join('')}</div>${stageControls()}<div class="card-head"><div><h3>${activeStage==='Recommendation'?'Why bid—or why not?':activeStage==='Interpretation'?'Interpretation review':activeStage==='Compliance'?'Compliance & capability match':activeStage==='Commercial'?'Commercial risk assessment':'Prepare a response'}</h3><p>${activeStage==='Recommendation'?'The reason behind the recommendation, the conditions and what would change it.':`Review the ${activeStage.toLowerCase()} findings. Sources, assumptions and unresolved gaps are visible.`}</p></div><span class="pill blue">AI-assisted · human reviewed</span></div>${body}<div class="review-foot"><span>${activeStage==='Recommendation'?'Human approval required at this gate.':`Review, question or add evidence before approving ${activeStage.toLowerCase()}.`}</span><div class="foot-actions"><button class="btn small" onclick="openModal()">Ask / correct</button><button class="btn small" onclick="notify('Evidence upload panel opened.')">＋ Evidence</button><button class="btn primary small" onclick="approveStage()">${activeStage==='Recommendation'?'Send to management':'Approve stage →'}</button></div></div></section>`}

decision</span></div><div class="row-meta">10 Dec</div></div></section><div class="right-stack"><section class="card pad"><h3 class="card-title">Your next actions</h3><div class="list-row"><span class="tick warn">!</span><div><b>Resolve bid security conflict</b><small>Makueni tender · 2 sources disagree</small></div></div><div class="list-row"><span class="tick warn">!</span><div><b>Confirm tax certificate</b><small>Evidence needed · Makueni tender</small></div></div><div class="list-row"><span class="tick">✓</span><div><b>Review management decision</b><small>County Revenue Data Platform</small></div></div></section><section class="card pad"><h3 class="card-title">Team activity</h3><div class="list-row"><span class="tick">✓</span><div><b>Interpretation completed</b><small>AI companion · 09:48</small></div></div><div class="list-row"><span class="tick">J</span><div><b>Added evidence: case studies</b><small>Jane Mwangi · Yesterday</small></div></div></section></div></div>`}

sts · 4 BI analysts</small></div></div><div class="list-row"><span class="avatar">NW</span><div><b>Delivery lead</b><small>CV on file · confirm years of experience</small></div></div><button class="btn small" style="margin-top:10px" onclick="notify('Team member editor opened.')">＋ Add team member</button></section><section class="card pad"><h3 class="card-title">Profile integrity</h3><div class="progress-track"><i style="width:82%"></i></div><div class="list-row"><span class="tick">✓</span><div><b>Registration details</b><small>Verified 12 Nov 2026</small></div></div><div class="list-row"><span class="tick warn">!</span><div><b>Tax certificate</b><small>Expiry date needs confirmation</small></div></div></section></div></div>`}
function evidence(){return `${heading('Organisation','Evidence library','Documents and verified claims the companion can cite. Missing files are never treated as proof of failure.',`<button class="btn primary" onclick="notify('Choose files to upload. Each upload can be assigned an owner and expiry date.')">＋ Upload evidence</button>`)}<section class="card"><div class="toolbar"><input class="search" placeholder="Search evidence…" aria-label="Search evidence" oninput="filterEvidence(this.value)"><select class="search" aria-label="Filter evidence" onchange="filterEvidence(document.querySelector('.toolbar input').value,this.value)"><option value="all">All categories</option><option>Certificates</option><option>Case studies</option><option>Team CVs</option><option>Policies</option></select></div><div class="table-wrap"><table id="evidenceTable"><thead><tr><th>Document</th><th>Category</th><th>Status</th><th>Expiry / review</th><th>Owner</th><th></th></tr></thead><tbody><tr data-search="tax compliance certificate certificates"><td><div class="file-row"><div class="file-icon">PDF</div><div><strong>Tax Compliance Certificate</strong><small>KRA · Uploaded 05 Sep 2026</small></div></div></td><td>Certificates</td><td><span class="tag amber">Verify expiry</span></td><td>Review needed</td><td>Finance</td><td><button class="textlink" onclick="notify('Evidence details opened.')">Open</button></td></tr><tr data-search="case study county analytics case studies"><td><div class="file-row"><div class="file-icon">PDF</div><div><strong>Makueni County Analytics — Case Study</strong><small>Engagement summary · Uploaded 12 Aug 2026</small></div></div></td><td>Case studies</td><td><span class="tag green">Verified</span></td><td>Annual review</td><td>Jane Mwangi</td><td><button class="textlink" onclick="notify('Evidence details opened.')">Open</button></td></tr><tr data-search="lead data scientist cv team cvs"><td><div class="file-row"><div class="file-icon">PDF</div><div><strong>Lead Data Scientist — CV</strong><small>Staff credential · Uploaded 19 Jun 2026</small></div></div></td><td>Team CVs</td><td><span class="tag">Needs review</span></td><td>Confirm experience</td><td>People team</td><td><button class="textlink" onclick="notify('Evidence details opened.')">Open</button></td></tr><tr data-search="professional indemnity insurance policy"><td><div class="file-row"><div class="file-icon">PDF</div><div><strong>Professional Indemnity Policy</strong><small>Insurance · Uploaded 16 Dec 2025</small></div></div></td><td>Policies</td><td><span class="tag amber">Expiring soon</span></td><td>15 Dec 2026</td><td>Finance</td><td><button class="textlink" onclick="notify('Evidence details opened.')">Open</button></td></tr></tbody></table></div><div class="review-foot"><span>28 items · Verified evidence is linked to its source document and review history.</span><button class="btn small" onclick="notify('Evidence review queue opened.')">Review expiring items</button></div></section>`}
function trail(){return `${heading('Accountability','Decision trail','A tamper-evident record of findings, corrections, evidence and human approvals.',`<button class="btn" onclick="notify('Decision trail export prepared.')">Export trail</button>`)}<section class="card"><div class="toolbar"><input class="search" placeholder="Search decisions…" aria-label="Search decision trail"><select class="search" aria-label="Filter by tender"><option>All tenders</option><option>Makueni analytics tender</option><option>Nairobi digital records</option></select></div><div class="tender-row"><div class="tick">✓</div><div style="flex:1"><b>New tender added to workspace</b><p>Provision of Data Analytics Consultancy Services · Intake</p><span class="row-meta">Jane Mwangi · 19 Nov 2026, 09:42 EAT</span></div><span class="tag">Human action</span></div><div class="tender-row"><div class="tick">✳</div><div style="flex:1"><b>Interpretation completed · version 1</b><p>18 facts extracted across 126 pages. Every cited quote linked to a page.</p><span class="row-meta">Tender interpretation agent · 19 Nov 2026, 09:48 EAT</span></div><span class="tag green">Agent finding</span></div><div class="tender-row"><div class="tick warn">!</div><div style="flex:1"><b>Bid security conflict flagged</b><p>KES 250,000 on p. 47 and KES 300,000 on p. 12. Values not silently merged.</p><span class="row-meta">Automated conflict check · 19 Nov 2026, 09:48 EAT</span></div><span class="tag amber">Needs review</span></div><div class="tender-row"><div class="tick">J</div><div style="flex:1"><b>Comparable assignment evidence linked</b><p>Three verified case studies matched to the experience requirement.</p><span class="row-meta">Jane Mwangi · 19 Nov 2026, 10:16 EAT</span></div><span class="tag">Evidence update</span></div><div class="tender-row"><div class="tick warn">!</div><div style="flex:1"><b>Recommendation held for management review</b><p>Conditional bid recommendation; tax certificate, security amount and payment safeguards unresolved.</p><span class="row-meta">Decision gate · Awaiting human approval</span></div><span class="tag amber">Pending</span></div><div class="callout">Every agent finding preserves its version and rationale. A human override requires a reason; it never erases the earlier recommendation.</div></section>`}
function settings(){return `${heading('Workspace','Settings','Manage organisation access, review gates and notification preferences.') }<div class="settings-layout"><section class="card settings-nav"><button class="active" onclick="settingsTab(this,'workspace')">Workspace</button><button onclick="settingsTab(this,'team')">Team & access</button><button onclick="settingsTab(this,'workflow')">Review workflow</button><button onclick="settingsTab(this,'alerts')">Notifications</button><button onclick="settingsTab(this,'data')">Data & sources</button></section><section class="card section-card" id="settingsPanel"><h3 class="card-title">Workspace details</h3><div class="profile-grid"><div class="field"><label>Workspace name</label><input value="Zanari Analytics"></div><div class="field"><label>Timezone</label><select><option>Africa/Nairobi (EAT)</option></select></div><div class="field"><label>Default currency</label><select><option>Kenyan Shilling (KES)</option></select></div><div class="field"><label>Default language</label><select><option>English</option></select></div></div><div style="padding:0 18px 18px"><h3 class="card-title">Human review gates</h3><div class="list-row"><span class="tick">✓</span><div><b>Require approval after each stage</b><small>Interpretation, compliance and commercial reviews</small></div><span class="tag green">On</span></div><div class="list-row"><span class="tick">✓</span><div><b>Management signs off bid/no-bid</b><small>AI recommendations cannot submit or finalize a decision</small></div><span class="tag green">On</span></div><div class="list-row"><span class="tick">✓</span><div><b>Require reason for overrides</b><small>Recorded with reviewer, timestamp and prior version</small></div><span class="tag green">On</span></div></div><div class="review-foot"><span>Settings changes are recorded in the workspace activity.</span><button class="btn primary small" onclick="notify('Settings saved.')">Save settings</button></div></section></div>`}
function setPage(p){activePage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').innerHTML=`${p==='settings'?'Manage':'Workspace'}&nbsp; / &nbsp;<b>${titleMap[p]}</b>`;if(p==='overview')content.innerHTML=overview();else if(p==='tenders')content.innerHTML=renderTender();else if(p==='company')content.innerHTML=company();else if(p==='evidence')content.innerHTML=evidence();else if(p==='trail')content.innerHTML=trail();else content.innerHTML=settings();window.scrollTo(0,0)}function setStage(s){activeStage=s;setPage('tenders')}function approveStage(){if(activeStage==='Recommendation'){notify('Decision submitted for management sign-off.');return}let i=stages.indexOf(activeStage);if(i<stages.length-1){activeStage=stages[i+1];setPage('tenders');notify(`${stages[i]} approved. Next: ${activeStage}.`)}else notify('Bid preparation review marked complete.')}
function settingsTab(button,tab){document.querySelectorAll('.settings-nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');const panel=document.getElementById('settingsPanel');const labels={workspace:['Workspace details','Workspace name','Timezone','Default currency','Default language'],team:['Team & access','Invite team members','Bid manager · Jane Mwangi','Finance · 2 members','Management · 3 members'],workflow:['Review workflow','Interpretation approval','Compliance approval','Commercial approval','Management bid/no-bid sign-off'],alerts:['Notifications','Deadline reminders','Evidence expiry alerts','Review assignment updates','Decision approvals'],data:['Data & sources','Tender documents','Company evidence library','Controller of Budget context','PPIP award data']};const x=labels[tab];panel.innerHTML=`<h3 class="card-title">${x[0]}</h3>${x.slice(1).map((a,i)=>`<div class="list-row" style="padding:13px 0"><span class="tick">${i===0?'✓':'•'}</span><div style="flex:1"><b>${a}</b><small>${tab==='workflow'?'Human review gate · approval required':tab==='data'?'Connected source · provenance visible':tab==='team'?'Workspace access · role based':tab==='alerts'?'Workspace preference · enabled':'Configured for this workspace'}</small></div><span class="tag ${i===0?'green':''}">${tab==='team'?'Manage':tab==='workflow'?'Required':'On'}</span></div>`).join('')}<div class="review-foot"><span>Changes are tracked in workspace activity.</span><button class="btn primary small" onclick="notify('Settings saved.')">Save settings</button></div>`}
function filterEvidence(query='',category='all'){document.querySelectorAll('#evidenceTable tbody tr').forEach(r=>{let text=r.dataset.search||'';r.style.display=(!query||text.includes(query.toLowerCase()))?'':'none'})}function openModal(){document.getElementById('overlay').classList.add('open');document.getElementById('note').focus()}function closeModal(){document.getElementById('overlay').classList.remove('open')}function submitNote(){const n=document.getElementById('note').value.trim();if(!n){document.getElementById('note').focus();return}closeModal();document.getElementById('note').value='';notify('Review note recorded. Finding queued for reassessment.')}function notify(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});setPage('tenders');
</script></body></html>
